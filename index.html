<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON VOID</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;touch-action:none;height:100%}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); addEventListener('resize', resize);

// ---------- Состояние ----------
let state = 'menu'; // menu, play, dead
let score = 0, wave = 0, waveTimer = 0, shake = 0, frame = 0;
const stars = Array.from({length:120},()=>({x:Math.random(),y:Math.random(),s:Math.random()*2+0.5,v:Math.random()*0.003+0.001}));

const bullets = [], enemies = [], eBullets = [], parts = [];
const player = { x:0, y:0, w:40, h:46, cd:0, inv:0, hp:3 };

// ---------- Волны ----------
function spawnWave(n){
  const count = 5 + Math.floor(n*1.5);
  for(let i=0;i<count;i++){
    const type = n>2 && i%5===4 ? 'tank' : (n>1 && i%3===2 ? 'zig' : 'basic');
    enemies.push({
      x: Math.random()*(W-80)+40, y: -60 - i*60,
      type, hp: type==='tank'?4:(type==='zig'?2:1),
      vx: 0, vy: type==='tank'?0.5:(type==='zig'?1.1:0.9),
      t: Math.random()*100, fire: Math.random()*200
    });
  }
}

// ---------- Рисование неоновых кораблей ----------
function glow(color, w, fn){ ctx.strokeStyle=color; ctx.lineWidth=w; ctx.shadowColor=color; ctx.shadowBlur=15; fn(); ctx.shadowBlur=0; }

function drawPlayer(){
  const x=player.x, y=player.y;
  ctx.save(); if(player.inv>0 && Math.floor(frame/4)%2) ctx.globalAlpha=0.4;
  glow('#00ffcc',2,()=>{ ctx.beginPath();
    ctx.moveTo(x,y-24); ctx.lineTo(x-18,y+16); ctx.lineTo(x-8,y+10);
    ctx.lineTo(x,y+18); ctx.lineTo(x+8,y+10); ctx.lineTo(x+18,y+16);
    ctx.closePath(); ctx.stroke(); });
  glow('#00aaff',2,()=>{ ctx.beginPath(); ctx.moveTo(x,y-14); ctx.lineTo(x,y+8); ctx.stroke(); });
  ctx.restore();
}

function drawEnemy(e){
  const x=e.x, y=e.y, t=frame*0.05;
  ctx.save(); ctx.translate(x,y);
  if(e.type==='basic'){
    glow('#ff2266',2,()=>{ ctx.beginPath();
      ctx.moveTo(0,16); ctx.lineTo(-16,-8); ctx.lineTo(0,-2); ctx.lineTo(16,-8);
      ctx.closePath(); ctx.stroke(); });
  } else if(e.type==='zig'){
    glow('#ffcc00',2,()=>{ ctx.rotate(Math.sin(t)*0.4); ctx.beginPath();
      ctx.moveTo(0,18); ctx.lineTo(-14,-10); ctx.lineTo(0,-4); ctx.lineTo(14,-10);
      ctx.closePath(); ctx.stroke(); });
  } else {
    glow('#aa44ff',2,()=>{ ctx.beginPath();
      ctx.moveTo(0,20); ctx.lineTo(-22,-6); ctx.lineTo(-10,-14); ctx.lineTo(0,-8);
      ctx.lineTo(10,-14); ctx.lineTo(22,-6); ctx.closePath(); ctx.stroke(); });
  }
  ctx.restore();
}

// ---------- Управление (касание) ----------
let touchX=null;
addEventListener('touchstart',e=>{ touchX=e.touches[0].clientX; if(state==='menu') startGame(); });
addEventListener('touchmove',e=>{ touchX=e.touches[0].clientX; });
addEventListener('touchend',()=>touchX=null);
addEventListener('keydown',e=>{ keys[e.code]=true; if(state==='menu'&&e.code==='Space')startGame(); });
addEventListener('keyup',e=>keys[e.code]=false);
const keys={};

function startGame(){ state='play'; score=0; wave=0; waveTimer=0; player.hp=3; player.inv=60;
  bullets.length=0; enemies.length=0; eBullets.length=0; parts.length=0; }

function boom(x,y,color,n=18){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, s=Math.random()*4+1;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30,color}); } }

// ---------- Игровой цикл ----------
function loop(){
  requestAnimationFrame(loop); frame++;
  ctx.fillStyle='rgba(0,0,10,0.35)'; ctx.fillRect(0,0,W,H);
  // звёзды
  for(const s of stars){ s.y+=s.v; if(s.y>1)s.y=0;
    ctx.fillStyle='rgba(200,220,255,'+s.s*0.3+')'; ctx.fillRect(s.x*W, s.y*H, s.s, s.s*2); }
  if(shake>0){ ctx.save(); ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.85; }

  if(state==='play'){
    // движение игрока
    player.y = H-90;
    if(touchX!==null){ const d=touchX-player.x; player.x += Math.max(-8,Math.min(8,d*0.2)); }
    if(keys.ArrowLeft||keys.KeyA) player.x-=8;
    if(keys.ArrowRight||keys.KeyD) player.x+=8;
    player.x = Math.max(25,Math.min(W-25,player.x));
    if(player.inv>0)player.inv--;

    // стрельба
    if(player.cd>0)player.cd--;
    if((touchX!==null||keys.Space)&&player.cd<=0){
      bullets.push({x:player.x,y:player.y-20}); player.cd=10;
    }
    for(const b of bullets){ b.y-=11;
      glow('#00ffcc',2,()=>{ ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x,b.y+12); ctx.stroke(); }); }
    for(let i=bullets.length-1;i>=0;i--) if(bullets[i].y<-20)bullets.splice(i,1);

    // волны
    waveTimer++;
    if(enemies.length===0 && waveTimer>90){ wave++; spawnWave(wave); waveTimer=0; }

    // враги
    for(const e of enemies){
      e.t+=0.05; e.y+=e.vy;
      if(e.type==='zig') e.x += Math.sin(e.t*2)*3;
      e.fire--; if(e.fire<=0 && e.y>0 && e.y<H-150){
        eBullets.push({x:e.x,y:e.y+14}); e.fire=180-Math.min(120,wave*10)+Math.random()*80; }
      drawEnemy(e);
      // столкновение с игроком
      if(Math.abs(e.x-player.x)<32 && Math.abs(e.y-player.y)<34 && player.inv<=0){
        e.hp=0; player.hp--; player.inv=90; boom(player.x,player.y,'#00ffcc'); shake=10;
        if(player.hp<=0){ state='dead'; boom(player.x,player.y,'#00ffcc',40); }
      }
    }
    // попадания пуль
    for(let i=bullets.length-1;i>=0;i--)for(let j=enemies.length-1;j>=0;j--){
      const b=bullets[i], e=enemies[j];
      if(Math.abs(b.x-e.x)<24 && Math.abs(b.y-e.y)<24){
        e.hp--; bullets.splice(i,1); boom(b.x,b.y,'#ffdd00',6);
        if(e.hp<=0){ boom(e.x,e.y,'#ff2266'); score+= e.type==='tank'?50:(e.type==='zig'?30:10); enemies.splice(j,1); shake=4; }
        break;
      }
    }
    for(let i=enemies.length-1;i>=0;i--) if(enemies[i].y>H+40)enemies.splice(i,1);

    // пули врагов
    for(const b of eBullets){ b.y+=5.5;
      glow('#ff4444',2,()=>{ ctx.beginPath(); ctx.arc(b.x,b.y,5,0,7); ctx.stroke(); });
      if(Math.abs(b.x-player.x)<16 && Math.abs(b.y-player.y)<22 && player.inv<=0){
        player.hp--; player.inv=90; shake=10; boom(player.x,player.y,'#00ffcc');
        if(player.hp<=0){ state='dead'; boom(player.x,player.y,'#00ffcc',40); }
      } }
    for(let i=eBullets.length-1;i>=0;i--) if(eBullets[i].y>H+20)eBullets.splice(i,1);

    // HUD
    ctx.shadowBlur=0; ctx.fillStyle='#00ffcc'; ctx.font='bold 20px monospace';
    ctx.textAlign='left'; ctx.fillText('СЧЁТ: '+score, 15, 35);
    ctx.textAlign='right'; ctx.fillText('ВОЛНА: '+wave, W-15, 35);
    ctx.textAlign='left'; ctx.fillText('❤'.repeat(player.hp), 15, 65);
  }

  if(state==='menu'){
    ctx.shadowBlur=0; ctx.textAlign='center'; ctx.fillStyle='#00ffcc';
    ctx.font='bold '+Math.min(64,W/8)+'px monospace'; ctx.shadowColor='#00ffcc'; ctx.shadowBlur=25;
    ctx.fillText('NEON VOID', W/2, H/2-60);
    ctx.shadowBlur=0; ctx.font='20px monospace'; ctx.fillStyle='#fff';
    ctx.fillText('Коснитесь экрана, чтобы начать', W/2, H/2+20);
    ctx.fillText('Двигайте палец — корабль следует за ним', W/2, H/2+55);
    player.x=W/2; drawPlayer();
  }
  if(state==='dead'){
    ctx.shadowBlur=0; ctx.textAlign='center'; ctx.fillStyle='#ff2266';
    ctx.font='bold 48px monospace'; ctx.shadowColor='#ff2266'; ctx.shadowBlur=20;
    ctx.fillText('КОРАБЛЬ УНИЧТОЖЕН', W/2, H/2-30);
    ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.font='24px monospace';
    ctx.fillText('Счёт: '+score+'   Волна: '+wave, W/2, H/2+20);
    ctx.fillText('Коснитесь экрана', W/2, H/2+60);
    addEventListener('touchstart',()=>{ if(state==='dead'&&frame>60)startGame(); },{once:false});
  }

  // частицы
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.l--;
    if(p.l<=0){parts.splice(i,1);continue;}
    ctx.fillStyle=p.color; ctx.globalAlpha=p.l/30; ctx.fillRect(p.x-1.5,p.y-1.5,3,3); ctx.globalAlpha=1; }

  if(shake>0) ctx.restore();
}
loop();
</script>
</body>
</html>
