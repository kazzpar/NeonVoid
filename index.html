<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON VOID</title>
<style>
/* ======================================= */
/* 🌌 СТИЛИ КАРКАСА И ЭКРАНОВ ИГРЫ */
/* ======================================= */

html,body{margin:0;padding:0;background:#000;overflow:hidden;touch-action:none;height:100%}
canvas{display:block;width:100vw;height:100vh; position: fixed; top: 0; left: 0;}

/* Общее для экранов */
.screen {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease;
}
.screen.hidden, #intro-screen.hidden {
    opacity: 0;
    pointer-events: none;
}

/* Звёзды (для красивого фона) */
.stars-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
}

/* ======================================= */
/* 💫 СТИЛИ МЕНЮ И АНИМАЦИИ */
/* ======================================= */

/* Название (NEON VOID) */
.title-display {
    text-align: center;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    line-height: 1.1;
    position: relative;
    z-index: 2;
}

.title-line1, .title-line2 {
    font-size: 22vw;
    letter-spacing: 0.15em;
}

.title-line1 { color: #A855F7;
    text-shadow: 0 0 10px #A855F7, 0 0 30px #A855F7, 0 0 60px #7C3AED; }
.title-line2 { color: #22D3EE;
    text-shadow: 0 0 10px #22D3EE, 0 0 30px #22D3EE, 0 0 60px #0891B2; }

/* ПУЛЬСАЦИЯ */
@keyframes titlePulse {
    0%, 100% { transform: scale(1);    filter: brightness(1); }
    50%      { transform: scale(1.03); filter: brightness(1.25); }
}

/* Интро: плавное появление + пульсация */
#intro-screen .title-display {
    opacity: 0;
    animation: titleFadeIn 2.5s ease forwards,
               titlePulse 2.5s ease-in-out 2.5s infinite;
}
@keyframes titleFadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
}

/* Меню: пульсация без появления */
#menu-screen .title-display {
    animation: titlePulse 2.5s ease-in-out infinite;
    margin-bottom: 8vh;
}

/* Подпись автора */
.intro-author {
    position: absolute;
    bottom: 30px; left: 0; right: 0;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    letter-spacing: 0.3em;
    color: #666;
    opacity: 0;
    animation: authorFadeIn 2s ease 1.5s forwards;
    z-index: 2;
}
@keyframes authorFadeIn { from { opacity: 0; } to { opacity: 0.8; } }

/* СТЕКЛЯННЫЕ КНОПКИ (iOS-style) */
.menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 2;
}

.glass-btn {
    min-width: 240px;
    padding: 14px 40px;
    border-radius: 50px;              /* овал */
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.4),
        0 8px 32px rgba(168,85,247,0.15);
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    letter-spacing: 0.25em;
    cursor: pointer;
    transition: all 0.2s ease;
}
.glass-btn:active {
    background: rgba(255,255,255,0.2);
    transform: scale(0.96);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5),
                0 4px 16px rgba(168,85,247,0.3);
}

/* ======================================= */
/* 📰 ЭКРАНЫ РЕКОРДОВ / ОБ ИГРЕ */
/* ======================================= */

.screen-title {
    font-family: 'Courier New', monospace;
    color: #fff;
    letter-spacing: 0.3em;
    font-size: 28px;
    margin-bottom: 6vh;
    z-index: 2;
    text-shadow: 0 0 20px #A855F7;
}

.glass-panel {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 24px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    padding: 24px 32px;
    color: #ddd;
    font-family: 'Courier New', monospace;
    text-align: center;
    max-width: 80%;
    z-index: 2;
}

.about-text p { margin: 0 0 16px; line-height: 1.5; }
.about-author { color: #22D3EE; letter-spacing: 0.2em; }
.records-score-display {
    font-size: 32px;
    color: #A855F7;
    margin-top: 10px;
}

.back-btn { margin-top: 6vh; }
</style>
</head>
<body>

<!-- ======================================= -->
<!-- 🌌 ЭКРАН ЗВЁЗД (ОБЩИЙ ФОН) -->
<!-- Этот canvas будет статичным фоном для всех экранов -->
<canvas id="stars-canvas-background" style="z-index: 1;"></canvas>

<!-- 🎬 ИНТРО (ПОКАЗЫВАЕТСЯ ПЕРВЫМ) -->
<div id="intro-screen" class="screen">
    <div class="title-display">
        <div class="title-line1">NEON</div>
        <div class="title-line2">VOID</div>
    </div>
    <div class="intro-author">by kazzpar</div>
</div>

<!-- 🕹️ ГЛАВНОЕ МЕНЮ -->
<div id="menu-screen" class="screen hidden">
    <div class="title-display">
        <div class="title-line1">NEON</div>
        <div class="title-line2">VOID</div>
    </div>
    <div class="menu-buttons">
        <button class="glass-btn" id="btn-start">СТАРТ</button>
        <button class="glass-btn" id="btn-records">РЕКОРДЫ</button>
        <button class="glass-btn" id="btn-about">ОБ ИГРЕ</button>
        <button class="glass-btn" id="btn-exit">ВЫХОД</button>
    </div>
</div>

<!-- 🏆 ЭКРАН РЕКОРДОВ -->
<div id="records-screen" class="screen hidden">
    <h2 class="screen-title">РЕКОРДЫ</h2>
    <div class="glass-panel">
        <p>ЛУЧШИЙ РЕЗУЛЬТАТ</p>
        <div class="records-score-display" id="records-list">0</div>
    </div>
    <button class="glass-btn back-btn" id="btn-records-back">← НАЗАД</button>
</div>

<!-- 📚 ЭКРАН "ОБ ИГРЕ" -->
<div id="about-screen" class="screen hidden">
    <h2 class="screen-title">ОБ ИГРЕ</h2>
    <div class="glass-panel about-text">
        <p>NEON VOID — неоновая аркада
           из глубин космоса.</p>
        <p class="about-author">by kazzpar<br>© 2025</p>
    </div>
    <button class="glass-btn back-btn" id="btn-about-back">← НАЗАД</button>
</div>

<!-- 🎮 КАНВАС ДЛЯ САМОЙ ИГРЫ (ОСТАЕТСЯ ТУТ) -->
<canvas id="c"></canvas>

<!-- ======================================= -->
<!-- 🧠 СИСТЕМА МЕНЮ И АНИМАЦИЙ (JS) -->
<!-- ======================================= -->
<script>
// ============================================================
// 1. СИСТEMA ЗВЁЗДОВОГО ФОНА (Для всех экранов)
// ============================================================
function initStars(canvasId) {
    var c = document.getElementById(canvasId);
    if (!c) return null;
    var ctx = c.getContext('2d');
    var stars = [];
    function resize() {
        c.width = c.offsetWidth;
        c.height = c.offsetHeight;
    }
    resize();
    for (var i = 0; i < 90; i++) {
        stars.push({
            x: Math.random(), y: Math.random(),
            r: Math.random() * 1.6 + 0.4,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 1.5 + 0.5
        });
    }
    function draw(t) {
        ctx.clearRect(0, 0, c.width, c.height);
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            // Генерация эффекта мерцания
            var a = 0.25 + 0.75 * Math.abs(Math.sin(s.phase + t * 0.001 * s.speed));
            ctx.beginPath();
            ctx.arc(s.x * c.width, s.y * c.height, s.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
            ctx.fill();
        }
              }
        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
    return true;
}

// Фон-звёзды для меню и подэкранов
initStars('stars-canvas-background');

// ============================================================
// 2. ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
// ============================================================
function showScreen(id) {
    var screens = ['intro-screen', 'menu-screen', 'records-screen', 'about-screen'];
    for (var i = 0; i < screens.length; i++) {
        var el = document.getElementById(screens[i]);
        if (!el) continue;
        if (screens[i] === id) {
            el.classList.remove('hidden');
        } else {
            el.classList.add('hidden');
        }
    }
}

// ============================================================
// 3. КНОПКИ МЕНЮ
// ============================================================
document.getElementById('btn-start').addEventListener('click', function() {
    showScreen('none'); // скрыть все экраны — начинается игра
    startGame();
});
document.getElementById('btn-records').addEventListener('click', function() {
    // Обновляем рекорд перед показом
    var best = parseInt(localStorage.getItem('neonvoid_best') || 0, 10);
    document.getElementById('records-list').textContent = best;
    showScreen('records-screen');
});
document.getElementById('btn-about').addEventListener('click', function() {
    showScreen('about-screen');
});
document.getElementById('btn-exit').addEventListener('click', function() {
    // В APK закрывает приложение; в браузере просто заглушка
    if (navigator.app && navigator.app.exitApp) {
        navigator.app.exitApp();
    }
});
document.getElementById('btn-records-back').addEventListener('click', function() {
    showScreen('menu-screen');
});
document.getElementById('btn-about-back').addEventListener('click', function() {
    showScreen('menu-screen');
});

// Тап по интро — сразу в меню (не ждать 3.5 сек)
document.getElementById('intro-screen').addEventListener('click', function() {
    goMenu();
});

// Автопереход из интро в меню
var introDone = false;
function goMenu() {
    if (introDone) return;
    introDone = true;
    showScreen('menu-screen');
    setTimeout(function() {
        var intro = document.getElementById('intro-screen');
        if (intro) intro.remove();
    }, 1000);
}
setTimeout(goMenu, 3500);
</script>

<!-- ======================================= -->
<!-- 🎮 КОД САМОЙ ИГРЫ (ваша логика) -->
<!-- ======================================= -->
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;W=innerWidth;H=innerHeight;ctx.setTransform(d,0,0,d,0,0);}
resize();addEventListener('resize',resize);

let state='menu',score=0,wave=0,waveTimer=0,shake=0,frame=0;
const stars=Array.from({length:120},()=>({x:Math.random(),y:Math.random(),s:Math.random()*2+0.5,v:Math.random()*0.003+0.001}));
const bullets=[],enemies=[],eBullets=[],parts=[];
const player={x:0,y:0,cd:0,inv:0,hp:3};
const keys={};
let touchX=null;

function startGame(){state='play';score=0;wave=0;waveTimer=0;player.hp=3;player.inv=60;player.x=W/2;bullets.length=0;enemies.length=0;eBullets.length=0;parts.length=0;}
function spawnWave(n){const c=5+Math.floor(n*1.5);for(let i=0;i<c;i++){const t=n>2&&i%5===4?'tank':(n>1&&i%3===2?'zig':'basic');enemies.push({x:Math.random()*(W-80)+40,y:-60-i*60,type:t,hp:t==='tank'?4:(t==='zig'?2:1),vy:t==='tank'?0.5:(t==='zig'?1.1:0.9),t:Math.random()*100,fire:Math.random()*200});}}
function boom(x,y,c,n=18){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*4+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30,c});}}

function glow(c,w,fn){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.shadowColor=c;ctx.shadowBlur=15;fn();ctx.shadowBlur=0;}

function drawPlayer(){const x=player.x,y=player.y;ctx.save();if(player.inv>0&&Math.floor(frame/4)%2)ctx.globalAlpha=0.4;
glow('#00ffcc',2,()=>{ctx.beginPath();ctx.moveTo(x,y-24);ctx.lineTo(x-18,y+16);ctx.lineTo(x-8,y+10);ctx.lineTo(x,y+18);ctx.lineTo(x+8,y+10);ctx.lineTo(x+18,y+16);ctx.closePath();ctx.stroke();});
glow('#00aaff',2,()=>{ctx.beginPath();ctx.moveTo(x,y-14);ctx.lineTo(x,y+8);ctx.stroke();});
ctx.restore();}

function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);const t=frame*0.05;
if(e.type==='basic'){glow('#ff2266',2,()=>{ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(-16,-8);ctx.lineTo(0,-2);ctx.lineTo(16,-8);ctx.closePath();ctx.stroke();});}
else if(e.type==='zig'){glow('#ffcc00',2,()=>{ctx.rotate(Math.sin(t)*0.4);ctx.beginPath();ctx.moveTo(0,18);ctx.lineTo(-14,-10);ctx.lineTo(0,-4);ctx.lineTo(14,-10);ctx.closePath();ctx.stroke();});}
else{glow('#aa44ff',2,()=>{ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(-22,-6);ctx.lineTo(-10,-14);ctx.lineTo(0,-8);ctx.lineTo(10,-14);ctx.lineTo(22,-6);ctx.closePath();ctx.stroke();});}
ctx.restore();}

// Управление — работает ТОЛЬКО когда игра активна (экраны меню скрыты)
function gameActive(){return state==='play'||state==='menu';}
addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;if(state==='menu'&&document.getElementById('menu-screen').classList.contains('hidden'))startGame();});
addEventListener('touchmove',e=>{touchX=e.touches[0].clientX;});
addEventListener('touchend',()=>touchX=null);
addEventListener('mousedown',()=>{if(state==='menu'&&document.getElementById('menu-screen').classList.contains('hidden'))startGame();});
addEventListener('keydown',e=>{keys[e.code]=true;if(state==='menu'&&e.code==='Space'&&document.getElementById('menu-screen').classList.contains('hidden'))startGame();});
addEventListener('keyup',e=>keys[e.code]=false);

function loop(){
requestAnimationFrame(loop);frame++;
// Если виден любой экран меню — игру не рисуем/не обновляем активно
const menuVisible=!document.getElementById('menu-screen').classList.contains('hidden')||
!document.getElementById('records-screen').classList.contains('hidden')||
!document.getElementById('about-screen').classList.contains('hidden');
if(menuVisible&&state!=='play')return;

ctx.fillStyle='rgba(0,0,10,0.35)';ctx.fillRect(0,0,W,H);
for(const s of stars){s.y+=s.v;if(s.y>1)s.y=0;ctx.fillStyle='rgba(200,220,255,'+(s.s*0.3)+')';ctx.fillRect(s.x*W,s.y*H,s.s,s.s*2);}
if(shake>0){ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);shake*=0.85;}

if(state==='play'){
player.y=H-90;
if(touchX!==null){const d=touchX-player.x;player.x+=Math.max(-8,Math.min(8,d*0.2));}
if(keys.ArrowLeft||keys.KeyA)player.x-=8;
if(keys.ArrowRight||keys.KeyD)player.x+=8;
player.x=Math.max(25,Math.min(W-25,player.x));
if(player.inv>0)player.inv--;
if(player.cd>0)player.cd--;
if((touchX!==null||keys.Space)&&player.cd<=0){bullets.push({x:player.x,y:player.y-20});player.cd=10;}

waveTimer++;
if(enemies.length===0&&waveTimer>90){wave++;spawnWave(wave);waveTimer=0;}

for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
e.t+=0.05;e.y+=e.vy;
if(e.type==='zig')e.x+=Math.sin(e.t*2)*3;
e.fire--;if(e.fire<=0&&e.y>0&&e.y<H-150){eBullets.push({x:e.x,y:e.y+14});e.fire=180-Math.min(120,wave*10)+Math.random()*80;}
drawEnemy(e);
if(Math.abs(e.x-player.x)<32&&Math.abs(e.y-player.y)<34&&player.inv<=0){e.hp=0;player.hp--;player.inv=90;boom(player.x,player.y,'#00ffcc');shake=10;if(player.hp<=0){state='dead';boom(player.x,player.y,'#00ffcc',40);saveRecord();}}
if(e.hp<=0||e.y>H+40)enemies.splice(i,1);}

for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y-=11;let hit=false;
for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];
if(Math.abs(b.x-e.x)<24&&Math.abs(b.y-e.y)<24){e.hp--;boom(b.x,b.y,'#ffdd00',6);hit=true;
if(e.hp<=0){boom(e.x,e.y,'#ff2266');score+=e.type==='tank'?50:(e.type==='zig'?30:10);enemies.splice(j,1);shake=4;}break;}}
if(hit||b.y<-20)bullets.splice(i,1);}

for(let i=eBullets.length-1;i>=0;i--){const b=eBullets[i];b.y+=5.5;
if(Math.abs(b.x-player.x)<16&&Math.abs(b.y-player.y)<22&&player.inv<=0){player.hp--;player.inv=90;shake=8;eBullets.splice(i,1);boom(player.x,player.y,'#ff4444',10);if(player.hp<=0){state='dead';boom(player.x,player.y,'#ff4444',40);saveRecord();}continue;}
if(b.y>H+40)eBullets.splice(i,1);}

drawPlayer();
for(const b of bullets){glow('#00ffcc',2,()=>{ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y+12);ctx.stroke();});}
for(const b of eBullets){glow('#ff4444',2,()=>{ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.stroke();});}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0){parts.splice(i,1);continue;}ctx.globalAlpha=p.l/30;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);}
ctx.globalAlpha=1;
ctx.fillStyle='#00ffcc';ctx.font='18px monospace';ctx.textAlign='left';ctx.shadowBlur=0;
ctx.fillText('SCORE: '+score,20,30);
ctx.fillText('HP: '+player.hp,20,55);
ctx.fillText('WAVE: '+wave,20,80);
}else if(state==='dead'){
// Экран смерти: показываем результат, тап = в меню
for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0)continue;ctx.globalAlpha=p.l/30;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);}
ctx.globalAlpha=1;
ctx.textAlign='center';ctx.shadowBlur=0;
ctx.fillStyle='#00ffcc';ctx.font='bold 40px monospace';
ctx.fillText('ИГРА ОКОНЧЕНА',W/2,H/2-40);
ctx.fillStyle='#ffffff';ctx.font='20px monospace';
ctx.fillText('SCORE: '+score,W/2,H/2+10);
ctx.fillText('Нажмите для выхода в меню',W/2,H/2+50);
if(touchX!==null||keys.Space){
    state='menu';
    showScreen('menu-screen');
    keys.Space=false;
}
}
if(shake>0.1)ctx.restore();
}

// Запись рекорда в localStorage
function saveRecord(){
    var best=parseInt(localStorage.getItem('neonvoid_best')||0,10);
    if(score>best){localStorage.setItem('neonvoid_best',score);}
}

loop();
</script>
</body>
</html>
