<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON VOID</title>
<style>
/* ======================================= */
/* 🌌 СТИЛИ КАРКАСА И ЭКРАНОВ ИГРЫ */
/* ======================================= */

html,body{margin:0;padding:0;background:#000;overflow:hidden;touch-action:none;height:100%}
canvas{display:block;width:100vw;height:100vh; position: fixed; top: 0; left: 0;}
#c{z-index:2;} /* игровой канвас — ПОВЕРХ звёздного фона */

/* Общее для экраны */
.screen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88); /* чуть прозрачный, чтобы звёзды просвечивали */
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease;
}
.screen.hidden, #intro-screen.hidden {
    opacity: 0;
    pointer-events: none;
}

/* Звёзды (для красивого фона) */
.stars-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
}

/* ======================================= */
/* 💫 СТИЛИ МЕНЮ И АНИМАЦИИ */
/* ======================================= */

/* Название (NEON VOID) */
.title-display {
    text-align: center;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    line-height: 1.1;
    position: relative;
    z-index: 2;
}

.title-line1, .title-line2 {
    font-size: 22vw;
    letter-spacing: 0.15em;
}

.title-line1 { color: #A855F7;
    text-shadow: 0 0 10px #A855F7, 0 0 30px #A855F7, 0 0 60px #7C3AED; }
.title-line2 { color: #22D3EE;
    text-shadow: 0 0 10px #22D3EE, 0 0 30px #22D3EE, 0 0 60px #0891B2; }

/* ПУЛЬСАЦИЯ */
@keyframes titlePulse {
    0%, 100% { transform: scale(1);    filter: brightness(1); }
    50%      { transform: scale(1.03); filter: brightness(1.25); }
}

/* Интро: плавное появление + пульсация */
#intro-screen .title-display {
    opacity: 0;
    animation: titleFadeIn 2.5s ease forwards,
               titlePulse 2.5s ease-in-out 2.5s infinite;
}
@keyframes titleFadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
}

/* Меню: пульсация без появления */
#menu-screen .title-display {
    animation: titlePulse 2.5s ease-in-out infinite;
    margin-bottom: 8vh;
}

/* Подпись автора */
.intro-author {
    position: absolute;
    bottom: 30px; left: 0; right: 0;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    letter-spacing: 0.3em;
    color: #666;
    opacity: 0;
    animation: authorFadeIn 2s ease 1.5s forwards;
    z-index: 2;
}
@keyframes authorFadeIn { from { opacity: 0; } to { opacity: 0.8; } }

/* СТЕКЛЯННЫЕ КНОПКИ (iOS-style) */
.menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 2;
}

.glass-btn {
    min-width: 240px;
    padding: 14px 40px;
    border-radius: 50px;              /* овал */
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.4),
        0 8px 32px rgba(168,85,247,0.15);
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    letter-spacing: 0.25em;
    cursor: pointer;
    transition: all 0.2s ease;
}
.glass-btn:active {
    background: rgba(255,255,255,0.2);
    transform: scale(0.96);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5),
                0 4px 16px rgba(168,85,247,0.3);
}

/* ======================================= */
/* 📰 ЭКРАНЫ РЕКОРДОВ / ОБ ИГРЕ */
/* ======================================= */

.screen-title {
    font-family: 'Courier New', monospace;
    color: #fff;
    letter-spacing: 0.3em;
    font-size: 28px;
    margin-bottom: 6vh;
    z-index: 2;
    text-shadow: 0 0 20px #A855F7;
}

.glass-panel {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 24px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    padding: 24px 32px;
    color: #ddd;
    font-family: 'Courier New', monospace;
    text-align: center;
    max-width: 80%;
    z-index: 2;
}

.about-text p { margin: 0 0 16px; line-height: 1.5; }
.about-author { color: #22D3EE; letter-spacing: 0.2em; }
.records-score-display {
    font-size: 32px;
    color: #A855F7;
    margin-top: 10px;
}

.back-btn { margin-top: 6vh; }
</style>

<body>

<!-- ======================================= -->
<!-- 🌌 ЭКРАН ЗВЁЗД (ОБЩИЙ ФОН) -->
<canvas id="stars-canvas-background" style="z-index: 1;"></canvas>

<!-- 🎬 ИНТРО (ПОКАЗЫВАЕТСЯ ПЕРВЫМ) -->
<div id="intro-screen" class="screen">
    <div class="title-display">
        <div class="title-line1">NEON</div>

</div>

</div>

<div id="records-screen" class="screen hidden">

    <div class="glass-panel">

    <button class="glass-btn back-btn" id="btn-records-back">← НАЗАД</button>
</div>

<!-- 📚 ЭКРАН "ОБ ИГРЕ" -->
<div id="about-screen" class="screen hidden">
    <h2 class="screen-title">ОБ ИГРЕ</h2>
    <div class="glass-panel about-text">
        <p>NEON VOID — неоновая аркада
           из глубин космоса.</p>
        <p class="about-author">by kazzpar<br>© 2025</p>
    </div>
    <button class="glass-btn back-btn" id="btn-about-back">← НАЗАД</button>
</div>

<!-- 🎮 КАНВАС ДЛЯ САМОЙ ИГРЫ -->
<canvas id="c"></canvas>

<!-- ======================================= -->
<!-- 🧠 СИСТЕМА МЕНЮ И АНИМАЦИЙ (JS) -->
<!-- ======================================= -->
<script>
// ============================================================
// 1. ЗВЁЗДНЫЙ ФОН
// ============================================================
(function() {
    var c = document.getElementById('stars-canvas-background');
    if (!c) return;
    var ctx = c.getContext('2d');
    function resize() {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    var stars = [];
    for (var i = 0; i < 90; i++) {
        stars.push({
            x: Math.random(), y: Math.random(),
            r: Math.random() * 1.6 + 0.4,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 1.5 + 0.5
        });
    }
    function draw(t) {
        ctx.clearRect(0, 0, c.width, c.height);
        for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var a = 0.25 + 0.75 * Math.abs(Math.sin(s.phase + t * 0.001 * s.speed));
            ctx.beginPath();
            ctx.arc(s.x * c.width, s.y * c.height, s.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
})();

// ============================================================
// 2. ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
// ============================================================
var SCREENS = ['intro-screen', 'menu-screen', 'records-screen', 'about-screen'];

function showScreen(id) {
    for (var i = 0; i < SCREENS.length; i++) {
        var el = document.getElementById(SCREENS[i]);
        if (!el) continue;
        if (SCREENS[i] === id) {
            el.classList.remove('hidden');
        } else {
            el.classList.add('hidden');
        }
    }
}

// ============================================================
// 3. ПЕРЕХОД ИЗ ИНТРО В МЕНЮ (с предохранителем)
// ============================================================
var introDone = false;

function goMenu() {
    if (introDone) return;
    introDone = true;
    showScreen('menu-screen');
    var intro = document.getElementById('intro-screen');
    if (intro) setTimeout(function() { intro.remove(); }, 1000);
}

// Тап/клик по интро — сразу в меню
var introEl = document.getElementById('intro-screen');
if (introEl) {
    introEl.addEventListener('touchstart', function(e) { e.preventDefault(); goMenu(); });
    introEl.addEventListener('click', goMenu);
}

// Автопереход через 3.5 секунды
setTimeout(goMenu, 3500);

// ПРЕДОХРАНИТЕЛЬ: даже если что-то сломалось выше —
// через 5 секунд меню откроется принудительно
setTimeout(function() {
    if (!introDone) {
        console.log('FAILSAFE: принудительный переход в меню');
        goMenu();
    }
}, 5000);

// ============================================================
// 4. КНОПКИ МЕНЮ
// ============================================================
function on(id, fn) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', fn);
    el.addEventListener('touchstart', function(e) { e.preventDefault(); fn(); });
}

on('btn-start', function() {
    showScreen('none');
    if (typeof startGame === 'function') startGame();
});
on('btn-records', function() {
    var best = parseInt(localStorage.getItem('neonvoid_best') || '0', 10);
    var r = document.getElementById('records-list');
    if (r) r.textContent = best;
    showScreen('records-screen');
});
on('btn-about', function() { showScreen('about-screen'); });
on('btn-exit', function() {
    if (navigator.app && navigator.app.exitApp) navigator.app.exitApp();
    else alert('Закройте вкладку, чтобы выйти.');
});
on('btn-records-back', function() { showScreen('menu-screen'); });
on('btn-about-back', function() { showScreen('menu-screen'); });
</script>


<!-- ======================================= -->
<!-- 🎮 ЭЛЕМЕНТЫ ИГРОВОГО ИНТЕРФЕЙСА -->
<!-- ======================================= -->

<!-- ⏸️ Кнопка паузы (видна только во время игры) -->
<div id="pause-btn" style="
    display: none;
    position: fixed;
    top: 15px;
    right: 15px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    font-size: 20px;
    line-height: 46px;
    text-align: center;
    z-index: 5000;
    cursor: pointer;
    user-select: none;">⏸</div>

<!-- ⏸️ Экран паузы -->
<div id="pause-screen" class="screen hidden" style="z-index: 6000;">
    <h2 class="screen-title">ПАУЗА</h2>
    <div class="menu-buttons">
        <button class="glass-btn" id="btn-resume">ПРОДОЛЖИТЬ</button>
        <button class="glass-btn" id="btn-quit-menu">В МЕНЮ</button>
    </div>
</div>

<!-- 💀 Экран смерти -->
<div id="gameover-screen" class="screen hidden" style="z-index: 7000;">
    <h2 class="screen-title">КОНЕЦ ИГРЫ</h2>
    <div class="glass-panel">
        <p>ВАШ СЧЁТ</p>
        <div class="records-score-display" id="final-score">0</div>
        <p id="new-record" style="display:none; color:#22D3EE; margin-top:10px;">
            ★ НОВЫЙ РЕКОРД! ★
        </p>
    </div>
    <div class="menu-buttons" style="margin-top: 5vh;">
        <button class="glass-btn" id="btn-restart">ЗАНОВО</button>
        <button class="glass-btn" id="btn-gameover-menu">В МЕНЮ</button>
    </div>
</div>

<!-- 🎮 Игровой канвас + ИГРОВАЯ ЛОГИКА -->
<script>
// ============================================================
// ИГРОВОЙ ЦИКЛ NEON VOID
// ============================================================
var cv  = document.getElementById('c'),
    ctx = cv.getContext('2d');

cv.width  = window.innerWidth;
cv.height = window.innerHeight;

// ✅ ИСПРАВЛЕНО: W и H обновляются при повороте/ресайзе экрана
var W = cv.width, H = cv.height;
window.addEventListener('resize', function() {
    cv.width  = window.innerWidth;
    cv.height = window.innerHeight;
    W = cv.width;
    H = cv.height;
    // возвращаем корабль в пределы экрана после поворота
    if (ship) {
        ship.x = Math.max(20, Math.min(W - 20, ship.x));
        ship.y = Math.max(60, Math.min(H - 40, ship.y));
    }
});

// ✅ ДОБАВЛЕНО: определяем, тач-устройство ли это
var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// Состояние игры
var state       = 'menu',   // menu | playing | paused | dead
    score       = 0,
    wave        = 0,
    shake       = 0,
    keys        = {},
    menuVisible = true;

// Сущности
var ship, bullets, enemies, ebullets, particles, stars;

function resetGame() {
    ship     = { x: W/2, y: H - 90, w: 26, h: 34, cool: 0, alive: true };
    bullets  = [];
    enemies  = [];
    ebullets = [];
    particles = [];
    stars    = [];
    for (var i = 0; i < 60; i++) {
        stars.push({ x: Math.random()*W, y: Math.random()*H,
                     s: Math.random()*2 + 0.5 });
    }
    score = 0; wave = 0; shake = 0;
}

function startGame() {
    resetGame();
    state = 'playing';
    menuVisible = false;
    document.getElementById('pause-btn').style.display = 'block';
    document.getElementById('gameover-screen').classList.add('hidden');
    // ✅ ИСПРАВЛЕНО: на случай рестарта из паузы прячем и её
    document.getElementById('pause-screen').classList.add('hidden');
}

// ---------- Спавн врагов ----------
function spawnWave() {
    wave++;
    var n = 3 + Math.min(wave, 7);
    for (var i = 0; i < n; i++) {
        enemies.push({
            x: Math.random()*(W-60)+30,
            y: -40 - Math.random()*120,
            r: 16,
            hp: 1 + Math.floor(wave/3),
            vx: (Math.random()-0.5)*1.5,
            vy: 0.8 + Math.random()*0.8 + wave*0.08,
            cool: Math.random()*120
        });
    }
}

// ---------- Взрыв ----------
function boom(x, y, color, count) {
    for (var i = 0; i < (count||14); i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5)*5,
            vy: (Math.random()-0.5)*5,
            life: 30 + Math.random()*20,
            color: color
        });
    }
}

// ---------- Управление ----------
document.addEventListener('keydown', function(e) { keys[e.code] = true; });
document.addEventListener('keyup',   function(e) { keys[e.code] = false; });

// Тап/движение пальца на мобиле
cv.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    ship.x = t.clientX;
    ship.y = t.clientY - 60;
}, { passive: false });
cv.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    ship.x = t.clientX;
    ship.y = t.clientY - 60;
    // ✅ ДОБАВЛЕНО: пока палец на экране — корабль стреляет
    keys['TouchFire'] = true;
}, { passive: false });
// ✅ ДОБАВЛЕНО: убираем палец — стрельба прекращается
cv.addEventListener('touchend', function(e) {
    e.preventDefault();
    keys['TouchFire'] = false;
}, { passive: false });

// ---------- Смерть ----------
function gameOver() {
    state = 'dead';
    ship.alive = false;
    boom(ship.x, ship.y, '#A855F7', 30);
    shake = 15;
    document.getElementById('pause-btn').style.display = 'none';

    var best = parseInt(localStorage.getItem('neonvoid_best') || '0', 10);
    var isNew = score > best;
    if (isNew) localStorage.setItem('neonvoid_best', String(score));

    document.getElementById('final-score').textContent = score;
    document.getElementById('new-record').style.display = isNew ? 'block' : 'none';
    document.getElementById('gameover-screen').classList.remove('hidden');
}

// ---------- Выход в меню ----------
function quitToMenu() {
    state = 'menu';
    menuVisible = true;
    score = 0; wave = 0;
    enemies = []; ebullets = []; bullets = []; particles = [];
    document.getElementById('pause-btn').style.display = 'none';
    document.getElementById('pause-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    showScreen('menu-screen');
}

// ---------- Обновление ----------
function update() {
    // ✅ ИСПРАВЛЕНО: после смерти частицы взрыва продолжают лететь
    if (state === 'dead') {
        for (var i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }
        if (shake > 0) shake *= 0.85;
        return;
    }

    if (state !== 'playing') return;

    // Движение корабля (клавиатура)
    var spd = 5.5;
    if (keys['ArrowLeft']  || keys['KeyA']) ship.x -= spd;
    if (keys['ArrowRight'] || keys['KeyD']) ship.x += spd;
    if (keys['ArrowUp']    || keys['KeyW']) ship.y -= spd;
    if (keys['ArrowDown']  || keys['KeyS']) ship.y += spd;
    ship.x = Math.max(20, Math.min(W-20, ship.x));
    ship.y = Math.max(60, Math.min(H-40, ship.y));

    // Стрельба
    if (ship.cool > 0) ship.cool--;
    // ✅ ИСПРАВЛЕНО: на тач-устройствах — автоогонь (классика жанра)
    if ((keys['Space'] || keys['TouchFire'] || isTouch) && ship.cool <= 0) {
        bullets.push({ x: ship.x, y: ship.y - 20, vy: -9 });
        ship.cool = 12;
    }

    // Звёзды фон
    for (var i = 0; i < stars.length; i++) {
        stars[i].y += stars[i].s;
        if (stars[i].y > H) { stars[i].y = 0; stars[i].x = Math.random()*W; }
    }

    // Пули игрока
    for (i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y += bullets[i].vy;
        if (bullets[i].y < -10) bullets.splice(i, 1);
    }

    // Враги
    if (enemies.length === 0) spawnWave();
    for (i = enemies.length - 1; i >= 0; i--) {
        var en = enemies[i];
        en.x += en.vx; en.y += en.vy;
        if (en.x < 20 || en.x > W-20) en.vx *= -1;

        // стрельба врагов
        en.cool--;
        if (en.cool <= 0 && en.y > 0 && en.y < H/2) {
            ebullets.push({ x: en.x, y: en.y + en.r, vy: 3.5 + wave*0.15 });
            en.cool = 140 - Math.min(wave*8, 70);
        }

        // вылет за экран
        if (en.y > H + 50) { enemies.splice(i, 1); continue; }

        // столкновение с кораблём
        var dx = en.x - ship.x, dy = en.y - ship.y;
        if (dx*dx + dy*dy < (en.r+16)*(en.r+16)) {
            enemies.splice(i, 1);
            boom(en.x, en.y, '#22D3EE');
            gameOver();
            return;
        }

        // попадания пуль игрока
        for (var j = bullets.length - 1; j >= 0; j--) {
            var b = bullets[j];
            var bx = b.x - en.x, by = b.y - en.y;
            if (bx*bx + by*by < en.r*en.r) {
                bullets.splice(j, 1);
                en.hp--;
                if (en.hp <= 0) {
                    enemies.splice(i, 1);
                    boom(en.x, en.y, '#A855F7');
                    score += 10;
                    shake = Math.max(shake, 4);
                }
                break;
            }
        }
    }

    // Пули врагов
    for (i = ebullets.length - 1; i >= 0; i--) {
        ebullets[i].y += ebullets[i].vy;
        if (ebullets[i].y > H + 10) { ebullets.splice(i, 1); continue; }
        var ex = ebullets[i].x - ship.x, ey = ebullets[i].y - ship.y;
        if (ex*ex + ey*ey < 14*14) {
            ebullets.splice(i, 1);
            gameOver();
            return;
        }
    }

    // Частицы
    for (i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (shake > 0) shake *= 0.85;
}

// ---------- Отрисовка ----------
function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    var shaking = shake > 0.1 && state !== 'menu';
    if (shaking) {
        ctx.save();
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // Звёзды
    for (var i = 0; i < stars.length; i++) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(stars[i].x, stars[i].y, stars[i].s, stars[i].s);
    }

    if (state !== 'menu') {
        // Корабль
        if (ship.alive) {
            ctx.save();
            ctx.shadowColor = '#22D3EE';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#22D3EE';
            ctx.beginPath();
            ctx.moveTo(ship.x, ship.y - 20);
            ctx.lineTo(ship.x - 15, ship.y + 15);
            ctx.lineTo(ship.x + 15, ship.y + 15);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // Пули игрока
        ctx.save();
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#fff';
        for (i = 0; i < bullets.length; i++) {
            ctx.fillRect(bullets[i].x - 2, bullets[i].y - 8, 4, 12);
        }
        ctx.restore();

        // Враги
        for (i = 0; i < enemies.length; i++) {
            ctx.save();
            ctx.shadowColor = '#A855F7';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#A855F7';
            ctx.beginPath();
            ctx.arc(enemies[i].x, enemies[i].y, enemies[i].r, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }

        // Пули врагов
        ctx.save();
        ctx.shadowColor = '#F43F5E';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#F43F5E';
        for (i = 0; i < ebullets.length; i++) {
            ctx.beginPath();
            ctx.arc(ebullets[i].x, ebullets[i].y, 4, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();

        // Частицы
        for (i = 0; i < particles.length; i++) {
            var p = particles[i];
            ctx.globalAlpha = Math.max(p.life / 50, 0);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;

        // Счёт
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('СЧЁТ: ' + score, 15, 30);
        ctx.fillText('ВОЛНА: ' + wave, 15, 55);
    }

    if (shaking) ctx.restore();
}

// ---------- Главный цикл ----------
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

resetGame();
loop();

// Наведение фокуса для клавиатуры
window.focus();
</script>

<!-- ======================================= -->
<!-- ⏸️ СИСТЕМА ПАУЗЫ (отдельный скрипт, -->
<!--    выполняется ПОСЛЕ создания всех элементов) -->
<!-- ======================================= -->
<script>
// Пауза
function openPause() {
    if (state !== 'playing') return;
    state = 'paused';
    document.getElementById('pause-screen').classList.remove('hidden');
}

function closePause() {
    if (state !== 'paused') return;
    state = 'playing';
    document.getElementById('pause-screen').classList.add('hidden');
}

on('pause-btn', openPause);
on('btn-resume', closePause);
on('btn-quit-menu', quitToMenu);
on('btn-restart', startGame);
on('btn-gameover-menu', quitToMenu);

// Клавиша Esc — пауза
document.addEventListener('keydown', function(e) {
    if (e.code === 'Escape') {
        if (state === 'playing') openPause();
        else if (state === 'paused') closePause();
    }
});

// ---------- Кнопка "Назад" (Android / браузер) ----------
function handleBack() {
    if (state === 'paused')  { closePause();  return true; }
    if (state === 'playing') { openPause();   return true; }
    if (state === 'dead')    { quitToMenu();  return true; }

    // Экраны меню
    var rec = document.getElementById('records-screen');
    var abt = document.getElementById('about-screen');
    if (!rec.classList.contains('hidden')) { showScreen('menu-screen'); return true; }
    if (!abt.classList.contains('hidden')) { showScreen('menu-screen'); return true; }
    return false;
}

document.addEventListener('backbutton', function(e) {
    if (handleBack()) e.preventDefault();
}, false);

window.addEventListener('popstate', function() { handleBack(); });
</script>
